# Local development services only. Credentials are development-only placeholders.
name: nua-crew
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nua
      POSTGRES_PASSWORD: nua_dev_password
      POSTGRES_DB: nua_crew
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nua -d nua_crew"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
