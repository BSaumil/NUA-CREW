# Local development services only. Credentials are development-only placeholders.
name: nua-crew
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      # The superuser exists only to bootstrap roles (initdb/). The app NEVER connects as it:
      # a superuser silently bypasses row-level security.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_only
      POSTGRES_DB: postgres
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
