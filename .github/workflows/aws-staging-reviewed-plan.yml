name: aws-staging-reviewed-plan

# Read-only, manual plan. No apply role or AWS resource mutations.
# Protected GitHub environment and exact main branch are mandatory.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nua-crew-staging-plan
  cancel-in-progress: false

jobs:
  staging-plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nua-crew-staging-plan
    defaults:
      run:
        working-directory: infra/aws/staging
    env:
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_STAGING_ACCOUNT_ID }}
      AWS_PLAN_ROLE_ARN: ${{ vars.AWS_STAGING_PLAN_ROLE_ARN }}
      TF_VAR_expected_aws_account_id: ${{ vars.AWS_STAGING_ACCOUNT_ID }}
      TF_VAR_budget_alert_email: ${{ vars.AWS_STAGING_BUDGET_ALERT_EMAIL }}
      TF_VAR_monthly_budget_usd: '300'
      TF_VAR_enable_services: 'false'
      TF_VAR_allowed_https_cidrs: '[]'
      TF_VAR_redis_auth_token: ${{ secrets.AWS_STAGING_REDIS_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify plan-only prerequisites (fail closed)
        shell: bash
        env:
          TF_STATE_BUCKET: ${{ vars.AWS_STAGING_STATE_BUCKET }}
          TF_STATE_KMS_KEY_ARN: ${{ vars.AWS_STAGING_STATE_KMS_KEY_ARN }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]] || exit 1
          [[ "$AWS_PLAN_ROLE_ARN" == "arn:aws:iam::${EXPECTED_AWS_ACCOUNT_ID}:role/"* ]] || exit 1
          [[ "$TF_STATE_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{2,62}$ ]] || exit 1
          [[ "$TF_STATE_KMS_KEY_ARN" == "arn:aws:kms:ap-southeast-2:${EXPECTED_AWS_ACCOUNT_ID}:key/"* ]] || exit 1
          [[ "$TF_VAR_budget_alert_email" == *"@"* ]] || exit 1
          [[ ${#TF_VAR_redis_auth_token} -ge 16 ]] || exit 1
          echo "Protected plan prerequisites present; services disabled; ingress closed."
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STAGING_PLAN_ROLE_ARN }}
          role-session-name: nua-crew-staging-plan
          aws-region: ap-southeast-2
      - name: Confirm AWS account (no resource writes)
        shell: bash
        run: |
          set -euo pipefail
          actual="$(aws sts get-caller-identity --query Account --output text)"
          test "$actual" = "$EXPECTED_AWS_ACCOUNT_ID"
          echo "Expected AWS account verified (ID suppressed)."
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
      - name: Initialise encrypted remote state (never local state)
        shell: bash
        env:
          TF_STATE_BUCKET: ${{ vars.AWS_STAGING_STATE_BUCKET }}
          TF_STATE_KMS_KEY_ARN: ${{ vars.AWS_STAGING_STATE_KMS_KEY_ARN }}
        run: |
          set -euo pipefail
          terraform init -input=false -no-color \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=ap-southeast-2" \
            -backend-config="kms_key_id=$TF_STATE_KMS_KEY_ARN"
          terraform validate -no-color
      - name: Read-only plan; never save or upload sensitive plan files
        shell: bash
        run: |
          set -euo pipefail
          # A plan is not a price quote and does not authorise apply.
          terraform plan -input=false -no-color -lock-timeout=30s \
            -var='enable_services=false' -var='allowed_https_cidrs=[]' \
            -var='monthly_budget_usd=300' -out=/tmp/nua-crew-staging.tfplan
          echo "PLAN ONLY. No apply, DNS, migration, secrets output or deployment."
      - name: Destroy local sensitive plan file
        if: always()
        shell: bash
        run: rm -f /tmp/nua-crew-staging.tfplan
