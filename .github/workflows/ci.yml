name: ci
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres_ci, POSTGRES_DB: nua_crew_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NUA_DATABASE_URL: postgresql+asyncpg://nua_runtime:nua_runtime_ci@localhost:5432/nua_crew_test
      NUA_MIGRATION_DATABASE_URL: postgresql+asyncpg://nua_migrator:nua_migrator_ci@localhost:5432/nua_crew_test
      NUA_TEST_REDIS_URL: redis://localhost:6379/15
    defaults: { run: { working-directory: services/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create least-privilege database roles
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          PGPASSWORD=postgres_ci psql -h localhost -U postgres -d nua_crew_test -v ON_ERROR_STOP=1 \
            -v migrator_password=nua_migrator_ci -v runtime_password=nua_runtime_ci -v grant_truncate=1 \
            -f ../../db/roles/bootstrap.sql
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q
      - name: Document safety and time-zone unit tests
        run: uv run python -m pytest unit_tests -q
      - name: Worker smoke test (drains and exits)
        run: uv run python -m app.worker --once
      - name: Audit the locked API production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --output-file /tmp/nua-api-requirements.txt
          uvx pip-audit -r /tmp/nua-api-requirements.txt

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm pilot:test
      - run: pnpm build
      - name: Mobile app compiles for Android and iOS (Metro + Hermes)
        run: pnpm --filter @nua-crew/mobile bundle:check
        env:
          EXPO_NO_TELEMETRY: '1'
          CI: '1'
      - name: Contracts are up to date with the API
        run: |
          (cd services/api && uv sync --frozen)
          pnpm contracts
          git diff --exit-code packages/contracts

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres_ci, POSTGRES_DB: nua_crew_e2e }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: astral-sh/setup-uv@v5
      - name: Create least-privilege database roles
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client >/dev/null
          PGPASSWORD=postgres_ci psql -h localhost -U postgres -d nua_crew_e2e -v ON_ERROR_STOP=1 \
            -v migrator_password=nua_migrator_ci -v runtime_password=nua_runtime_ci -v grant_truncate=1 \
            -f db/roles/bootstrap.sql
      - run: pnpm install --frozen-lockfile
      - run: cd services/api && uv sync --frozen
      - name: Check the hosted runner Chrome installation
        run: google-chrome --version
      - run: pnpm e2e
        env:
          CI: 'true'
          NUA_E2E_BROWSER_CHANNEL: chrome
          NUA_E2E_DATABASE_URL: postgresql+asyncpg://nua_runtime:nua_runtime_ci@localhost:5432/nua_crew_e2e
          NUA_E2E_MIGRATION_DATABASE_URL: postgresql+asyncpg://nua_migrator:nua_migrator_ci@localhost:5432/nua_crew_e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-traces-and-ui, path: tests/e2e/test-results, retention-days: 7 }
