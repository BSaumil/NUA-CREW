name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: nua, POSTGRES_PASSWORD: nua_dev_password, POSTGRES_DB: nua_crew_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nua" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NUA_DATABASE_URL: postgresql+asyncpg://nua:nua_dev_password@localhost:5432/nua_crew_test
    defaults: { run: { working-directory: services/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q
      - run: uvx pip-audit

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high
      - name: Contracts are up to date with the API
        run: |
          (cd services/api && uv sync --frozen)
          pnpm contracts
          git diff --exit-code packages/contracts

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: nua, POSTGRES_PASSWORD: nua_dev_password, POSTGRES_DB: nua_crew_e2e }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nua" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: astral-sh/setup-uv@v5
      - run: pnpm install --frozen-lockfile
      - run: cd services/api && uv sync --frozen
      - run: pnpm --filter @nua-crew/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: tests/e2e/test-results }
