name: temporary-brand-format-sync
# Branch-only formatter; remove this workflow before merging to main.
on:
  push:
    branches: [feat/approved-brand-kit-rollout-20261108]
    paths:
      - '.github/workflows/temporary-brand-format-sync.yml'

permissions:
  contents: write

jobs:
  format-brand-files:
    if: github.ref == 'refs/heads/feat/approved-brand-kit-rollout-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/approved-brand-kit-rollout-20261108
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run repository-locked Prettier on changed branding surfaces
        run: |
          pnpm exec prettier --write \
            apps/employer/app/layout.tsx \
            apps/mobile/src/ui/brand.tsx \
            apps/site/app/manifest.ts \
            apps/site/app/opengraph-image.tsx \
            apps/site/app/site.css \
            packages/ui/src/components.css \
            apps/site/app/layout.tsx \
            tests/e2e/specs/site.spec.ts
      - name: Commit formatting only to feature branch
        run: |
          set -euo pipefail
          git add apps/employer/app/layout.tsx apps/mobile/src/ui/brand.tsx \
            apps/site/app/manifest.ts apps/site/app/opengraph-image.tsx \
            apps/site/app/site.css packages/ui/src/components.css \
            apps/site/app/layout.tsx tests/e2e/specs/site.spec.ts
          if git diff --cached --quiet; then
            echo 'Formatting already matches Prettier.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: format approved brand rollout'
            git push origin HEAD:refs/heads/feat/approved-brand-kit-rollout-20261108
          fi
